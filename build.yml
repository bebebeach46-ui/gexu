name: Build GEXU

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleStandardDebug -Xmx2048m --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gexu-apk
          path: app/build/outputs/apk/standard/debug/*.apk
